name: SpaceMatch 3D models

# Fotografije proizvoda u 3D modele. Ne pokreće se samo od sebe: jedan model
# troši minute tuđe grafičke kartice, pa se pušta kad se uveze nov katalog.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Studio (prazno = svi koji čekaju)"
        required: false
        default: ""
      limit:
        description: "Koliko proizvoda najviše"
        required: false
        default: "6"
      resolution:
        description: "512 je dovoljno za telefon; više traje minutima"
        required: false
        default: "512"
        type: choice
        options: ["512", "1024"]

concurrency:
  group: spacematch-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Deljena kartica ume da čeka u redu; radije duže nego prekinuto na pola.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet "gradio_client>=1.5"
      - name: Napravi modele
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 tools/spacematch-3d.py \
            --key "$ADMIN_KEY" \
            --limit "${{ inputs.limit }}" \
            --resolution "${{ inputs.resolution }}" \
            ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}
