name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/hazard-detection-app-1j4lxb]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
        env:
          BASE_PATH: /milky-digital-menu-1-/
      - name: Self-host YOLO model files (no HuggingFace at runtime)
        run: |
          M=dist/models/Xenova/yolos-tiny-finetuned-coco/resolve/main
          mkdir -p "$M/onnx"
          curl -fsSL -o "$M/config.json" https://huggingface.co/Xenova/yolos-tiny-finetuned-coco/resolve/main/config.json
          curl -fsSL -o "$M/preprocessor_config.json" https://huggingface.co/Xenova/yolos-tiny-finetuned-coco/resolve/main/preprocessor_config.json
          curl -fsSL -o "$M/onnx/model_quantized.onnx" https://huggingface.co/Xenova/yolos-tiny-finetuned-coco/resolve/main/onnx/model_quantized.onnx
          ls -la "$M" "$M/onnx"
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
