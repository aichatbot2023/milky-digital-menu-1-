name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/hazard-detection-app-1j4lxb]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
        env:
          # Custom domen (safenessai.co.uk) služi sajt sa korena
          BASE_PATH: /
      - name: Fresh-path copy (/v2/) — cache-proof entry URL
        run: |
          mkdir /tmp/v2 && cp dist/app/index.html /tmp/v2/ && mv /tmp/v2 dist/v2
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          cname: safenessai.co.uk
